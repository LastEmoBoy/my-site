<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2=".55"><stop stop-color="#f9fbfd"/><stop offset=".58" stop-color="#edf3f7"/><stop offset="1" stop-color="#ccd6de"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#ffffff"/><stop offset=".23" stop-color="#d3dce3"/><stop offset=".5" stop-color="#8798a6"/><stop offset=".66" stop-color="#ecf3f6"/><stop offset="1" stop-color="#7f909d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#c7d2db"/><stop offset=".5" stop-color="#657782"/><stop offset="1" stop-color="#dfe7ec"/></linearGradient>
  <linearGradient id="shiny" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#e5ecf2"/><stop offset=".32" stop-color="#a2b1bd"/><stop offset=".55" stop-color="#e2e9ee"/><stop offset="1" stop-color="#627681"/></linearGradient>
  <linearGradient id="darkhole" x1=".1" y1="0" x2=".7" y2="1"><stop stop-color="#3c515e"/><stop offset=".8" stop-color="#8498a5"/><stop offset="1" stop-color="#e2e9ee"/></linearGradient>
  <linearGradient id="fades" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#f9fbfd" stop-opacity="1"/><stop offset=".45" stop-color="#f9fbfd" stop-opacity=".83"/><stop offset=".62" stop-color="#f9fbfd" stop-opacity=".06"/><stop offset="1" stop-color="#f9fbfd" stop-opacity="0"/></linearGradient>
  <pattern id="hair" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8" stroke="#fff" stroke-opacity=".22" stroke-width=".45"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
